# SpringBrand-specific Hermes config for Railway deployment.
#
# This file is COMMITTED to the springbrand-customizations branch so the
# config is reproducible / auditable. Railway entrypoint (or Dockerfile
# CMD) is responsible for placing this at $HERMES_HOME/config.yaml before
# starting `hermes gateway run`. Local dev uses
# /tmp/springbrand-hermes-demo/config.yaml generated by sp-a2a-agents-backend
# scripts/start-hermes-local.sh — both should keep platform_toolsets in
# sync.
#
# Wire:
#   demo agent-backend → POST /v1/runs (this Hermes daemon, via API server
#   platform) → springbrand_* tools → adapter / demo internal endpoints
#
# Per-agent toolset selection:
#   /v1/runs body now accepts `enabled_toolsets: [...]` (api_server.py patch)
#   so demo's executeBuyerAgentViaHermes can pick a SUBSET of the global
#   list below per agent_id (springbrand-supost-concierge gets
#   ["springbrand_supost", "skills"], springbrand-medusa-buyer gets
#   ["springbrand_medusa", "skills"], etc). The platform_toolsets list
#   here is the SUPERSET — anything outside it is hard-blocked.

model:
  provider: openrouter
  default: openai/gpt-4.1-mini
  base_url: https://openrouter.ai/api/v1

# API server platform exposes only the SpringBrand business tools + the
# Anthropic-style skills hub (so LLM can dynamically load SKILL.md from
# skills/ directory). We intentionally drop hermes-api-server's default
# toolset (web/terminal/browser/file write) — buyer concierge runs in
# production where shell access is unwanted.
platform_toolsets:
  api_server:
    - springbrand_supost
    - springbrand_medusa
    - skills
